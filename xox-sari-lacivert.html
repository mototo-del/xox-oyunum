<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XOX - Bilgisayara Karşı</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 20px; font-family: Arial, sans-serif; color: #fff;
    background: linear-gradient(135deg, #071a3d, #123b78);
  }
  .game {
    width: min(100%, 420px); padding: 25px; text-align: center;
    background: rgba(7,26,61,.78); border: 1px solid rgba(255,210,64,.35);
    border-radius: 24px; box-shadow: 0 18px 50px rgba(0,0,0,.25);
  }
  h1 { margin: 0 0 8px; font-size: 2.2rem; }
  .sub { color: #ffe58a; margin: 0 0 18px; }
  #status { min-height: 30px; font-size: 1.1rem; font-weight: bold; margin: 14px 0; }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell {
    aspect-ratio: 1; border: 0; border-radius: 15px; cursor: pointer;
    background: #fff4bd; color: #092653; font-size: clamp(2.8rem, 14vw, 4.3rem);
    font-weight: 800; box-shadow: 0 5px 0 #d4a900;
  }
  .cell:disabled { cursor: default; opacity: 1; }
  .cell.x { color: #123b78; }
  .cell.o { color: #d49b00; }
  .controls { display: flex; gap: 10px; margin-top: 20px; }
  .controls button {
    flex: 1; padding: 13px 10px; border: 0; border-radius: 12px;
    font-size: 1rem; font-weight: bold; cursor: pointer;
  }
  #restart { background: #ffd43b; color: #092653; }
  #sound { background: #123b78; color: #fff1a8; }
  .score { display: flex; justify-content: space-around; margin: 18px 0 0; color: #ffe58a; }
  .score strong { display: block; font-size: 1.3rem; color: #ffd43b; }
  .note { color: #d7e4ff; font-size: .82rem; margin: 18px 0 0; }
</style>
</head>
<body>
<main class="game">
  <h1>❌ XOX ⭕</h1>
  <p class="sub">Bilgisayara karşı oyna!</p>
  <div id="status" aria-live="polite">Sen ❌ ile başlıyorsun.</div>
  <div class="board" id="board" aria-label="XOX oyun tahtası">
    <button class="cell" data-i="0" aria-label="1. kare"></button>
    <button class="cell" data-i="1" aria-label="2. kare"></button>
    <button class="cell" data-i="2" aria-label="3. kare"></button>
    <button class="cell" data-i="3" aria-label="4. kare"></button>
    <button class="cell" data-i="4" aria-label="5. kare"></button>
    <button class="cell" data-i="5" aria-label="6. kare"></button>
    <button class="cell" data-i="6" aria-label="7. kare"></button>
    <button class="cell" data-i="7" aria-label="8. kare"></button>
    <button class="cell" data-i="8" aria-label="9. kare"></button>
  </div>
  <div class="score">
    <div>Sen<strong id="playerScore">0</strong></div>
    <div>Berabere<strong id="drawScore">0</strong></div>
    <div>Bilgisayar<strong id="computerScore">0</strong></div>
  </div>
  <div class="controls">
    <button id="restart">🔄 Yeniden başlat</button>
    <button id="sound">🔊 Ses açık</button>
  </div>
  <p class="note">Sen ❌, bilgisayar ⭕. Bilgisayar en iyi hamleyi yapmaya çalışır.</p>
</main>
<script>
(() => {
  const cells = [...document.querySelectorAll('.cell')];
  const statusEl = document.getElementById('status');
  const playerScoreEl = document.getElementById('playerScore');
  const drawScoreEl = document.getElementById('drawScore');
  const computerScoreEl = document.getElementById('computerScore');
  const soundButton = document.getElementById('sound');
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board = Array(9).fill('');
  let ended = false, soundOn = true, scores = { player: 0, draw: 0, computer: 0 };

  function playTone(freq=500, duration=.09) {
    if (!soundOn) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.frequency.value = freq; osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(.07, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
      osc.start(); osc.stop(ctx.currentTime + duration);
      osc.onended = () => ctx.close();
    } catch(e) {}
  }
  function winner(b) {
    for (const line of wins) if (b[line[0]] && line.every(i => b[i] === b[line[0]])) return b[line[0]];
    return b.every(Boolean) ? 'draw' : null;
  }
  function render() {
    cells.forEach((cell, i) => {
      cell.textContent = board[i];
      cell.className = 'cell' + (board[i] ? ' ' + (board[i] === 'X' ? 'x' : 'o') : '');
      cell.disabled = ended || Boolean(board[i]);
    });
  }
  function finish(result) {
    ended = true;
    if (result === 'X') { statusEl.textContent = '🎉 Kazandın!'; scores.player++; playTone(760,.22); }
    else if (result === 'O') { statusEl.textContent = '🤖 Bilgisayar kazandı!'; scores.computer++; playTone(220,.3); }
    else { statusEl.textContent = '🤝 Berabere!'; scores.draw++; playTone(420,.18); }
    playerScoreEl.textContent = scores.player;
    drawScoreEl.textContent = scores.draw;
    computerScoreEl.textContent = scores.computer;
    render();
  }
  function minimax(b, isMax) {
    const result = winner(b);
    if (result === 'O') return 10;
    if (result === 'X') return -10;
    if (result === 'draw') return 0;
    let best = isMax ? -Infinity : Infinity;
    for (let i=0; i<9; i++) if (!b[i]) {
      b[i] = isMax ? 'O' : 'X';
      const score = minimax(b, !isMax);
      b[i] = '';
      best = isMax ? Math.max(best, score) : Math.min(best, score);
    }
    return best;
  }
  function computerMove() {
    let bestScore = -Infinity, bestMove = -1;
    for (let i=0; i<9; i++) if (!board[i]) {
      board[i] = 'O';
      const score = minimax(board, false);
      board[i] = '';
      if (score > bestScore) { bestScore = score; bestMove = i; }
    }
    if (bestMove >= 0) board[bestMove] = 'O';
    render();
    const result = winner(board);
    if (result) finish(result);
    else statusEl.textContent = 'Sıra sende: ❌';
  }
  cells.forEach(cell => cell.addEventListener('click', () => {
    const i = Number(cell.dataset.i);
    if (ended || board[i]) return;
    board[i] = 'X'; playTone(560); render();
    const result = winner(board);
    if (result) { finish(result); return; }
    statusEl.textContent = 'Bilgisayar düşünüyor...';
    cells.forEach(c => c.disabled = true);
    window.setTimeout(computerMove, 350);
  }));
  document.getElementById('restart').addEventListener('click', () => {
    board = Array(9).fill(''); ended = false;
    statusEl.textContent = 'Sen ❌ ile başlıyorsun.';
    render();
  });
  soundButton.addEventListener('click', () => {
    soundOn = !soundOn;
    soundButton.textContent = soundOn ? '🔊 Ses açık' : '🔇 Ses kapalı';
    if (soundOn) playTone();
  });
  render();
})();
</script>
</body>
</html>
